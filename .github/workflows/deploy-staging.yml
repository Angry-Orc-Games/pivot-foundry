name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: foundry-e2e
  cancel-in-progress: false

jobs:
  staging:
    name: Build server deploy and smoke
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: build
    env:
      PIVOT_FOUNDRY_TARGET: staging
      PIVOT_FOUNDRY_BASE_URL: https://build.angryorcgames.com
      PIVOT_E2E_DESTRUCTIVE: "0"
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /e2e/
            /foundry/
            /package.json
            /package-lock.json

      - name: Check required staging secrets
        env:
          HAVE_FOUNDRY_DEPLOY_SSH_HOST: ${{ vars.FOUNDRY_DEPLOY_SSH_HOST != '' }}
          HAVE_FOUNDRY_DEPLOY_SSH_USER: ${{ vars.FOUNDRY_DEPLOY_SSH_USER != '' }}
          HAVE_FOUNDRY_DEPLOY_SSH_KEY: ${{ secrets.FOUNDRY_DEPLOY_SSH_KEY != '' }}
          HAVE_FOUNDRY_DEPLOY_TARGET_DIR: ${{ vars.FOUNDRY_DEPLOY_TARGET_DIR != '' }}
          HAVE_FOUNDRY_DEPLOY_BACKUP_DIR: ${{ vars.FOUNDRY_DEPLOY_BACKUP_DIR != '' }}
          HAVE_FOUNDRY_DEPLOY_SERVICE: ${{ vars.FOUNDRY_DEPLOY_SERVICE != '' }}
        run: bash trusted-gate/scripts/ci/check-deploy-config.sh build

      - name: Setup Node and install dependencies
        uses: ./trusted-gate/.github/actions/setup-node-deps
        with:
          working-directory: trusted-gate

      - name: Download CI package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pivot-foundry-system
          path: package-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Accept the packaged files
        run: bash trusted-gate/scripts/ci/accept-artifact.sh package-artifact trusted-gate system.json system.zip artifact-identity.json

      - name: Read package version
        id: package-version
        run: |
          version=$(bash trusted-gate/scripts/ci/package-version.sh trusted-gate/system.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact identity
        working-directory: trusted-gate
        run: node scripts/ci/verify-artifact-identity.mjs

      - name: Install Playwright browser
        working-directory: trusted-gate
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: npx playwright install chromium --with-deps

      - name: Deploy exact artifact to the build server
        env:
          FOUNDRY_DEPLOY_SSH_HOST: ${{ vars.FOUNDRY_DEPLOY_SSH_HOST }}
          FOUNDRY_DEPLOY_SSH_USER: ${{ vars.FOUNDRY_DEPLOY_SSH_USER }}
          FOUNDRY_DEPLOY_SSH_KEY: ${{ secrets.FOUNDRY_DEPLOY_SSH_KEY }}
          FOUNDRY_DEPLOY_TARGET_DIR: ${{ vars.FOUNDRY_DEPLOY_TARGET_DIR }}
          FOUNDRY_DEPLOY_BACKUP_DIR: ${{ vars.FOUNDRY_DEPLOY_BACKUP_DIR }}
          FOUNDRY_DEPLOY_SERVICE: ${{ vars.FOUNDRY_DEPLOY_SERVICE }}
          PIVOT_DEPLOY_PUBLIC_URL: https://build.angryorcgames.com
        working-directory: trusted-gate
        run: node scripts/deploy-package.mjs staging

      - name: Wait for the build server to come back after restart
        run: bash trusted-gate/scripts/ci/wait-for-foundry.sh "Build server"

      - name: External staging smoke
        env:
          PIVOT_PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        working-directory: trusted-gate
        run: npm run test:e2e:staging

      - name: Record staging acceptance
        working-directory: trusted-gate
        run: node scripts/record-acceptance.mjs staging

      - name: Record the staging artifact sha
        working-directory: trusted-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIVOT_CI_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/ci/record-staging-sha.sh "$PWD"

      - name: Upload staging-accepted artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-staging-accepted
          path: |
            trusted-gate/system.json
            trusted-gate/system.zip
            trusted-gate/artifact-identity.json
          if-no-files-found: error
          retention-days: 30
