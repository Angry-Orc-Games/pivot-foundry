name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Require nightly E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Require a green nightly E2E check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash trusted-gate/scripts/ci/require-nightly.sh

  package:
    name: Prepare release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Prepare release manifest
        run: npm run prepare:release

      - name: Build and validate release zip
        run: npm run package:system

      - name: Record artifact identity
        run: npm run artifact:identity

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-release-candidate
          path: |
            system.json
            system.zip
            artifact-identity.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [package, nightly]
    if: needs.package.result == 'success' && needs.nightly.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pivot-foundry-release-candidate
          path: package-artifact

      - name: Accept the packaged files
        run: bash trusted-gate/scripts/ci/accept-artifact.sh package-artifact release-files system.json system.zip artifact-identity.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            release-files/system.json
            release-files/system.zip
            release-files/artifact-identity.json
