name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: License gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: License gate
        run: bash trusted-gate/scripts/ci/e2e-gate.sh require

  package:
    name: Prepare release artifact
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Prepare release manifest
        run: npm run prepare:release

      - name: Build and validate release zip
        run: npm run package:system

      - name: Record artifact identity
        run: npm run artifact:identity

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-release-candidate
          path: |
            system.json
            system.zip
            artifact-identity.json
          if-no-files-found: error

  e2e:
    name: Test release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gate, package]
    environment: foundry-e2e
    concurrency:
      group: release-e2e-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /e2e/
            /foundry/
            /package.json
            /package-lock.json

      - name: License gate
        run: bash trusted-gate/scripts/ci/e2e-gate.sh require

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trusted-gate/package-lock.json

      - name: Install dependencies
        working-directory: trusted-gate
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: npm ci

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pivot-foundry-release-candidate
          path: package-artifact

      - name: Accept the packaged files
        run: bash trusted-gate/scripts/ci/accept-artifact.sh package-artifact trusted-gate system.json system.zip artifact-identity.json

      - name: Install Playwright browser
        working-directory: trusted-gate
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: npx playwright install chromium --with-deps

      - name: Run E2E against the prepared zip
        working-directory: trusted-gate
        env:
          FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
          FOUNDRY_RELEASE_CACHE_URL: ${{ secrets.FOUNDRY_RELEASE_CACHE_URL }}
          FOUNDRY_RELEASE_SHA256: ${{ secrets.FOUNDRY_RELEASE_SHA256 }}
          PIVOT_REQUIRE_RELEASE_SHA256: "1"
          PIVOT_FOUNDRY_TARGET: e2e
        run: |
          BEFORE=$(sha256sum system.zip | awk '{print $1}')
          npm run foundry:e2e -- --skip-package
          AFTER=$(sha256sum system.zip | awk '{print $1}')
          test "$BEFORE" = "$AFTER"

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [package, e2e]
    if: needs.e2e.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pivot-foundry-release-candidate
          path: package-artifact

      - name: Accept the packaged files
        run: bash trusted-gate/scripts/ci/accept-artifact.sh package-artifact release-files system.json system.zip artifact-identity.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            release-files/system.json
            release-files/system.zip
            release-files/artifact-identity.json
