name: Foundry E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to test after reviewing an external PR
        required: false

permissions:
  contents: read

concurrency:
  group: foundry-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Foundry E2E
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: foundry-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check Foundry secrets
        id: creds
        env:
          HAVE_ADMIN: ${{ secrets.FOUNDRY_ADMIN_KEY != '' }}
          HAVE_LICENSE: ${{ secrets.FOUNDRY_LICENSE_KEY != '' }}
          HAVE_CACHE: ${{ secrets.FOUNDRY_RELEASE_CACHE_URL != '' }}
          HAVE_SHA: ${{ secrets.FOUNDRY_RELEASE_SHA256 != '' }}
        run: |
          missing=()
          [ "$HAVE_ADMIN" = "true" ] || missing+=("FOUNDRY_ADMIN_KEY")
          [ "$HAVE_LICENSE" = "true" ] || missing+=("FOUNDRY_LICENSE_KEY")
          [ "$HAVE_CACHE" = "true" ] || missing+=("FOUNDRY_RELEASE_CACHE_URL")
          [ "$HAVE_SHA" = "true" ] || missing+=("FOUNDRY_RELEASE_SHA256")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Foundry E2E cannot run. Missing required secrets in GitHub Environment 'foundry-e2e': ${missing[*]}"
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.creds.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.available == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.creds.outputs.available == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run packaged Foundry E2E
        if: steps.creds.outputs.available == 'true'
        env:
          FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
          FOUNDRY_RELEASE_CACHE_URL: ${{ secrets.FOUNDRY_RELEASE_CACHE_URL }}
          FOUNDRY_RELEASE_SHA256: ${{ secrets.FOUNDRY_RELEASE_SHA256 }}
          PIVOT_REQUIRE_RELEASE_SHA256: "1"
          PIVOT_FOUNDRY_TARGET: e2e
        run: npm run foundry:e2e

      - name: Verify tests executed
        if: steps.creds.outputs.available == 'true'
        run: |
          if [ ! -d "playwright-report" ] && [ ! -d "test-results" ]; then
            echo "::error::E2E job completed but no Playwright test artifacts were created. Tests may not have executed."
            exit 1
          fi

      - name: Record E2E acceptance
        if: steps.creds.outputs.available == 'true' && success()
        run: node scripts/record-acceptance.mjs e2e

      - name: Upload tested artifact
        if: steps.creds.outputs.available == 'true' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pivot-foundry-e2e
          path: |
            system.json
            system.zip
            artifact-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized diagnostics
        if: steps.creds.outputs.available == 'true' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pivot-foundry-e2e-diagnostics
          path: |
            playwright-report
            test-results
            .foundry/instances/*/diagnostics
          if-no-files-found: warn
          retention-days: 7
