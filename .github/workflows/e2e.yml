name: Foundry E2E

on:
  schedule:
    # 07:00 UTC is 03:00 EDT and 02:00 EST, inside 02:00-06:00 America/New_York all year.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA reachable from a branch in this repository. Empty runs main and open e2e-nightly pull requests.
        required: false
      secrets_check_only:
        description: Verify foundry-e2e secrets are non-empty, then exit. Does not start Foundry, at any hour.
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.secrets_check_only) && format('foundry-e2e-secrets-{0}', github.ref) || 'foundry-e2e' }}
  cancel-in-progress: false

jobs:
  gate:
    name: License gate
    if: github.event_name != 'workflow_dispatch' || inputs.secrets_check_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.decide.outputs.ok }}
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          sparse-checkout: scripts/ci

      - name: Decide whether Foundry may start
        id: decide
        run: bash trusted-gate/scripts/ci/e2e-gate.sh license

  secrets:
    name: Foundry secret presence
    if: github.event_name == 'workflow_dispatch' && inputs.secrets_check_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: foundry-e2e
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          sparse-checkout: scripts/ci

      - name: Check Foundry secrets
        env:
          HAVE_ADMIN: ${{ secrets.FOUNDRY_ADMIN_KEY != '' }}
          HAVE_LICENSE: ${{ secrets.FOUNDRY_LICENSE_KEY != '' }}
          HAVE_CACHE: ${{ secrets.FOUNDRY_RELEASE_CACHE_URL != '' }}
          HAVE_SHA: ${{ secrets.FOUNDRY_RELEASE_SHA256 != '' }}
        run: bash trusted-gate/scripts/ci/e2e-gate.sh secrets

  plan:
    name: Select E2E targets
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: List main and labeled pull requests
        id: plan
        env:
          E2E_EVENT: ${{ github.event_name }}
          E2E_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
          E2E_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/e2e-targets.sh

  e2e:
    name: Foundry E2E (${{ matrix.target.name }})
    needs: [gate, plan]
    if: needs.gate.outputs.ok == 'true' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: foundry-e2e
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          sparse-checkout: scripts/ci

      - name: Recheck the license gate
        id: recheck
        run: bash trusted-gate/scripts/ci/e2e-gate.sh license

      - name: Stop when the license gate closes
        if: steps.recheck.outputs.ok != 'true'
        env:
          E2E_SHA: ${{ matrix.target.sha }}
          E2E_REPOSITORY: ${{ github.repository }}
          E2E_SUMMARY: Skipped before Foundry started. The license gate closed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash trusted-gate/scripts/ci/e2e-report.sh neutral
          echo "::notice::License gate closed before ${{ matrix.target.sha }}. Foundry will not start for this SHA."

      - name: Check Foundry secrets
        id: creds
        if: steps.recheck.outputs.ok == 'true'
        env:
          HAVE_ADMIN: ${{ secrets.FOUNDRY_ADMIN_KEY != '' }}
          HAVE_LICENSE: ${{ secrets.FOUNDRY_LICENSE_KEY != '' }}
          HAVE_CACHE: ${{ secrets.FOUNDRY_RELEASE_CACHE_URL != '' }}
          HAVE_SHA: ${{ secrets.FOUNDRY_RELEASE_SHA256 != '' }}
        run: bash trusted-gate/scripts/ci/e2e-gate.sh secrets

      - name: Checkout trusted runner
        if: steps.recheck.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        if: steps.recheck.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install trusted dependencies
        if: steps.recheck.outputs.ok == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.recheck.outputs.ok == 'true'
        run: npx playwright install chromium --with-deps

      - name: Checkout system under test
        if: steps.recheck.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.target.sha }}
          path: under-test

      - name: Overlay the system onto the trusted runner
        if: steps.recheck.outputs.ok == 'true'
        run: bash scripts/ci/e2e-overlay.sh . under-test

      - name: Run packaged Foundry E2E
        if: steps.recheck.outputs.ok == 'true' && steps.creds.outputs.available == 'true'
        env:
          FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
          FOUNDRY_RELEASE_CACHE_URL: ${{ secrets.FOUNDRY_RELEASE_CACHE_URL }}
          FOUNDRY_RELEASE_SHA256: ${{ secrets.FOUNDRY_RELEASE_SHA256 }}
          PIVOT_REQUIRE_RELEASE_SHA256: "1"
          PIVOT_FOUNDRY_TARGET: e2e
          PIVOT_E2E_SUBJECT: ${{ matrix.target.sha }}
        run: |
          set -o pipefail
          node scripts/foundry-cli.mjs e2e 2>&1 | tee "$RUNNER_TEMP/foundry-e2e.log"
          grep -F "Foundry started for E2E commit ${{ matrix.target.sha }}." "$RUNNER_TEMP/foundry-e2e.log"

      - name: Verify tests executed
        if: steps.recheck.outputs.ok == 'true' && steps.creds.outputs.available == 'true'
        run: |
          if [ ! -d "playwright-report" ] && [ ! -d "test-results" ]; then
            echo "::error::E2E job completed but no Playwright test artifacts were created. Tests may not have executed."
            exit 1
          fi

      - name: Record E2E acceptance
        if: steps.recheck.outputs.ok == 'true' && steps.creds.outputs.available == 'true' && success()
        run: node scripts/record-acceptance.mjs e2e

      - name: Upload tested artifact
        if: steps.recheck.outputs.ok == 'true' && steps.creds.outputs.available == 'true' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-e2e-${{ matrix.target.name }}
          path: |
            system.json
            system.zip
            artifact-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized diagnostics
        if: steps.recheck.outputs.ok == 'true' && steps.creds.outputs.available == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-e2e-${{ matrix.target.name }}-diagnostics
          path: |
            playwright-report
            test-results
            .foundry/instances/*/diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Report Foundry E2E success
        if: success() && steps.recheck.outputs.ok == 'true' && steps.creds.outputs.available == 'true'
        env:
          E2E_SHA: ${{ matrix.target.sha }}
          E2E_REPOSITORY: ${{ github.repository }}
          E2E_SUMMARY: Foundry started for E2E commit ${{ matrix.target.sha }}.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/e2e-report.sh success

      - name: Report Foundry E2E failure
        if: failure() && steps.recheck.outputs.ok == 'true'
        env:
          E2E_SHA: ${{ matrix.target.sha }}
          E2E_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          line="Foundry started for E2E commit ${E2E_SHA}."
          if [[ -f "$RUNNER_TEMP/foundry-e2e.log" ]] && grep -F -q "$line" "$RUNNER_TEMP/foundry-e2e.log"; then
            export E2E_SUMMARY="${line} The run failed after Foundry started."
          else
            export E2E_SUMMARY="Foundry did not start for ${E2E_SHA}."
          fi
          bash scripts/ci/e2e-report.sh failure
