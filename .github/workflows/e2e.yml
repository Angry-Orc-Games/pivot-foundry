name: Foundry E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to test after reviewing an external PR
        required: false

permissions:
  contents: read

concurrency:
  group: foundry-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Foundry E2E
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: foundry-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run packaged Foundry E2E
        env:
          FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
          FOUNDRY_RELEASE_CACHE_URL: ${{ secrets.FOUNDRY_RELEASE_CACHE_URL }}
          FOUNDRY_RELEASE_SHA256: ${{ secrets.FOUNDRY_RELEASE_SHA256 }}
          PIVOT_REQUIRE_RELEASE_SHA256: "1"
          PIVOT_FOUNDRY_TARGET: e2e
        run: npm run foundry:e2e

      - name: Record E2E acceptance
        if: success()
        run: node scripts/record-acceptance.mjs e2e

      - name: Upload tested artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-e2e
          path: |
            system.json
            system.zip
            artifact-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-e2e-diagnostics
          path: |
            playwright-report
            test-results
            .foundry/instances/*/diagnostics
          if-no-files-found: warn
          retention-days: 7
