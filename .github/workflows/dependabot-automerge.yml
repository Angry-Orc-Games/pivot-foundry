name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # fetch-metadata joins dependency names with ", " (comma space). Match the
      # whole name so a vitest update is not treated as vite. update-type is the
      # highest semver change in the pull request, so a grouped minor+patch PR
      # reports semver-minor and a PR that includes a major reports semver-major.
      - name: Enable auto-merge
        if: >-
          !contains(format(',{0},', steps.metadata.outputs.dependency-names), ',vite,') &&
          !contains(format(',{0},', steps.metadata.outputs.dependency-names), ', vite,') &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            (
              steps.metadata.outputs.dependency-type == 'direct:development' &&
              steps.metadata.outputs.update-type != 'version-update:semver-major'
            )
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
