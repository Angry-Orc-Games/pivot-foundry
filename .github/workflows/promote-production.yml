name: Promote production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: GitHub run id of the staging-accepted artifact
        required: true
      maintenance_window:
        description: Confirmed maintenance window note
        required: true

permissions:
  contents: read
  actions: read
  statuses: read
  checks: read

concurrency:
  group: foundry-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact staging artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PIVOT_FOUNDRY_TARGET: production
      PIVOT_FOUNDRY_BASE_URL: https://foundry.angryorcgames.com
      PIVOT_E2E_DESTRUCTIVE: "0"
      PIVOT_ALLOW_PRODUCTION_DEPLOY: "1"
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-gate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /e2e/
            /foundry/
            /package.json
            /package-lock.json

      - name: Setup Node and install dependencies
        uses: ./trusted-gate/.github/actions/setup-node-deps
        with:
          node-version: "20"
          working-directory: trusted-gate

      - name: Verify the staging run
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash trusted-gate/scripts/ci/promote-source.sh run

      - name: Download staging-accepted artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pivot-foundry-staging-accepted
          path: package-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.staging_run_id }}

      - name: Accept the packaged files
        run: bash trusted-gate/scripts/ci/accept-artifact.sh package-artifact trusted-gate system.json system.zip artifact-identity.json

      - name: Require a green nightly Foundry E2E on the packaged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # require-nightly.sh reads GITHUB_SHA; point it at the commit that built the zip.
          GITHUB_SHA=$(jq -er '.commit' package-artifact/artifact-identity.json) \
            bash trusted-gate/scripts/ci/require-nightly.sh

      - name: Read package version
        id: package-version
        run: |
          version=$(bash trusted-gate/scripts/ci/package-version.sh trusted-gate/system.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify the staging artifact bytes
        id: staging-bytes
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(bash trusted-gate/scripts/ci/promote-source.sh bytes trusted-gate)
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Confirm production runtime compatibility
        working-directory: trusted-gate
        env:
          PIVOT_PRODUCTION_MANIFEST_URL: ${{ secrets.PIVOT_PRODUCTION_MANIFEST_URL }}
        run: node scripts/ci/check-production-compat.mjs

      - name: Deploy exact artifact to production
        env:
          FOUNDRY_DEPLOY_SSH_HOST: ${{ vars.FOUNDRY_DEPLOY_SSH_HOST }}
          FOUNDRY_DEPLOY_SSH_USER: ${{ vars.FOUNDRY_DEPLOY_SSH_USER }}
          FOUNDRY_DEPLOY_SSH_KEY: ${{ secrets.FOUNDRY_DEPLOY_SSH_KEY }}
          FOUNDRY_DEPLOY_TARGET_DIR: ${{ vars.FOUNDRY_DEPLOY_TARGET_DIR }}
          FOUNDRY_DEPLOY_BACKUP_DIR: ${{ vars.FOUNDRY_DEPLOY_BACKUP_DIR }}
          FOUNDRY_DEPLOY_SERVICE: ${{ vars.FOUNDRY_DEPLOY_SERVICE }}
          PIVOT_DEPLOY_PUBLIC_URL: https://foundry.angryorcgames.com
          PIVOT_STAGING_ARTIFACT_SHA256: ${{ steps.staging-bytes.outputs.sha256 }}
        working-directory: trusted-gate
        run: node scripts/deploy-package.mjs production

      - name: Install Playwright browser
        working-directory: trusted-gate
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: npx playwright install chromium --with-deps

      - name: Wait for production to serve the promoted package
        env:
          PIVOT_PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          PIVOT_PRODUCTION_MANIFEST_URL: ${{ secrets.PIVOT_PRODUCTION_MANIFEST_URL }}
        run: |
          URL="${PIVOT_PRODUCTION_MANIFEST_URL:-$PIVOT_FOUNDRY_BASE_URL/systems/pivot-fantasy/system.json}"
          bash trusted-gate/scripts/ci/wait-for-foundry.sh Production "$URL" "${PIVOT_PACKAGE_VERSION:?}"

      - name: Non-destructive production health check
        working-directory: trusted-gate
        env:
          PIVOT_PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: npm run test:e2e:production

      - name: Record production acceptance
        working-directory: trusted-gate
        run: node scripts/record-acceptance.mjs production
