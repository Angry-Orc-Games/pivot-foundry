name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check. Full verification and the release package on one runner:
  # package:system rebuilds, so the build is not run twice.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: "22"

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint workflows
        run: npm run lint:workflows

      - name: Check localization keys
        run: npm run verify:l10n

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx --no playwright install chromium --with-deps

      - name: E2E sheet tests
        run: node scripts/e2e-sheet-tests.mjs

      - name: Audit dependencies
        run: npm run audit

      - name: Build and validate release zip
        run: npm run package:system

      - name: Record artifact identity
        run: npm run artifact:identity

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pivot-foundry-system
          path: |
            system.json
            system.zip
            artifact-identity.json
          if-no-files-found: error
          retention-days: 14

  # Required check. Engines floor is Node 20, so keep proving it, cheaply.
  node20:
    name: Node 20 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: "20"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
