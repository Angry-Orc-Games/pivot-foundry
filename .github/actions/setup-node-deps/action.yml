name: Set up Node and install dependencies
description: >-
  Pinned setup-node with npm caching, then a clean `npm ci`. Credentials are blanked for the
  install so dependency lifecycle scripts never see an Actions token. Call it after a checkout.

inputs:
  node-version:
    description: Node major version. Callers pass it so a runtime change is always visible in the workflow.
    required: true
  working-directory:
    description: Directory that holds package.json and package-lock.json.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        ACTIONS_RUNTIME_TOKEN: ""
        ACTIONS_RUNTIME_URL: ""
        ACTIONS_RESULTS_URL: ""
        ACTIONS_CACHE_URL: ""
      run: npm ci
